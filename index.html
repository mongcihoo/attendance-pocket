<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f3">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="个人考勤">
  <meta name="description" content="完全离线、数据只保存在本机的个人考勤与工时记录工具">
  <title>个人考勤</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">个人离线考勤</p>
        <h1 id="pageTitle">记录</h1>
      </div>
      <button id="quickAdd" class="primary compact" type="button">＋ 记一笔</button>
    </header>

    <main>
      <section id="recordsView" class="view active">
        <div class="person-switcher card">
          <label for="activePerson">当前人员</label>
          <select id="activePerson"></select>
          <div id="todayDots" class="session-status"></div>
        </div>
        <div class="section-heading">
          <div><h2>记录列表</h2><p id="recordCountText">0 条记录</p></div>
          <button id="toggleRecordFilters" class="ghost" type="button">筛选</button>
        </div>
        <div id="recordFilters" class="filter-panel card hidden">
          <label>开始日期<input id="listStart" type="date"></label>
          <label>结束日期<input id="listEnd" type="date"></label>
          <button id="clearRecordFilters" class="secondary" type="button">清除筛选</button>
        </div>
        <div id="recordList" class="record-list"></div>
      </section>

      <section id="calendarView" class="view">
        <div class="month-nav card">
          <button id="prevMonth" class="icon-button" aria-label="上个月">‹</button>
          <div><strong id="monthTitle"></strong><small id="monthSummary"></small></div>
          <button id="nextMonth" class="icon-button" aria-label="下个月">›</button>
        </div>
        <div class="calendar card">
          <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>
        <div class="legend"><span><i class="dot am"></i>上午</span><span><i class="dot pm"></i>下午</span></div>
        <div id="calendarDayRecords" class="record-list"></div>
      </section>

      <section id="statsView" class="view">
        <div class="filter-panel card stats-filters">
          <label>人员<select id="statsPerson"></select></label>
          <label>开始日期<input id="statsStart" type="date"></label>
          <label>结束日期<input id="statsEnd" type="date"></label>
          <label>地点<select id="statsPlace"></select></label>
          <label>工作内容<select id="statsTask"></select></label>
          <button id="resetStats" class="secondary" type="button">恢复本月</button>
        </div>
        <div id="statCards" class="stat-grid"></div>
        <div class="card breakdown"><div class="section-heading"><h2>地点统计</h2></div><div id="placeStats"></div></div>
        <div class="card breakdown"><div class="section-heading"><h2>工作内容统计</h2></div><div id="taskStats"></div></div>
      </section>

      <section id="settingsView" class="view">
        <div class="card settings-card">
          <div class="section-heading"><div><h2>人员管理</h2><p>建议保留 2–5 人</p></div><button id="addPerson" class="ghost" type="button">＋ 添加</button></div>
          <div id="peopleList" class="manage-list"></div>
        </div>
        <div class="card settings-card">
          <div class="section-heading"><div><h2>地点词库</h2><p>重命名或合并重复地点</p></div><button id="addPlace" class="ghost" type="button">＋ 添加</button></div>
          <div id="placeManageList" class="manage-list"></div>
        </div>
        <div class="card settings-card">
          <div class="section-heading"><div><h2>工作内容词库</h2><p>统一常用工作内容名称</p></div><button id="addTask" class="ghost" type="button">＋ 添加</button></div>
          <div id="taskManageList" class="manage-list"></div>
        </div>
        <div class="card settings-card">
          <div class="section-heading"><div><h2>备份与恢复</h2><p>建议每月备份一次到“文件”App</p></div></div>
          <div class="button-stack">
            <button id="exportJson" class="secondary" type="button">导出完整 JSON 备份</button>
            <label class="secondary file-button">导入 JSON 备份<input id="importJson" type="file" accept="application/json,.json"></label>
            <button id="exportCsv" class="secondary" type="button">导出记录 CSV</button>
          </div>
          <p id="storageSummary" class="fine-print"></p>
        </div>
        <div class="card settings-card">
          <div class="section-heading"><div><h2>离线与版本</h2><p>安装到主屏幕后可断网使用</p></div></div>
          <p id="pwaStatus" class="fine-print status-line"></p>
          <button id="checkUpdate" class="secondary full-width" type="button">检查应用更新</button>
        </div>
        <div class="card about-card"><strong>离线、本地、无账号</strong><p>所有正式数据仅保存在这台设备。应用不连接云数据库，也不会上传考勤内容。</p></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab active" data-view="records" type="button"><span>▤</span>记录</button>
      <button class="tab" data-view="calendar" type="button"><span>□</span>月历</button>
      <button class="tab" data-view="stats" type="button"><span>⌁</span>统计</button>
      <button class="tab" data-view="settings" type="button"><span>⚙</span>设置</button>
    </nav>
  </div>

  <dialog id="recordDialog">
    <form id="recordForm" method="dialog">
      <div class="dialog-header"><div><p class="eyebrow">考勤记录</p><h2 id="recordDialogTitle">新增记录</h2></div><button id="closeRecord" class="icon-button" type="button" aria-label="关闭">×</button></div>
      <input id="recordId" type="hidden">
      <fieldset id="recordPeopleFieldset"><legend>人员（可多选）</legend><div id="recordPeople" class="person-multi" role="group" aria-label="选择人员"></div><p id="personSelectionHint" class="field-hint"></p></fieldset>
      <label>工作日期<input id="recordDate" type="date" required></label>
      <fieldset><legend>时段</legend><div class="segmented period-segmented"><label><input name="period" type="radio" value="am" checked><span><i class="dot am"></i>上午</span></label><label><input name="period" type="radio" value="pm"><span><i class="dot pm"></i>下午</span></label><label><input name="period" type="radio" value="full"><span><i class="full-dots"><i class="dot am"></i><i class="dot pm"></i></i>全天</span></label></div></fieldset>
      <div class="form-grid time-hours-grid">
        <label>打卡时间<input id="recordTime" type="time" required></label>
        <label>实际工时<input id="recordHours" type="number" min="0" max="24" step="0.25" inputmode="decimal" placeholder="如 4" required></label>
      </div>
      <label>工作地点<input id="recordPlace" list="placeOptions" maxlength="80" placeholder="输入或选择历史地点" autocomplete="off" required></label>
      <datalist id="placeOptions"></datalist>
      <label>工作内容<input id="recordTask" list="taskOptions" maxlength="120" placeholder="输入或选择历史内容" autocomplete="off" required></label>
      <datalist id="taskOptions"></datalist>
      <label>备注（可选）<textarea id="recordNotes" maxlength="500" rows="3" placeholder="补充说明"></textarea></label>
      <p id="recordError" class="error" role="alert"></p>
      <div class="dialog-actions"><button id="deleteRecord" class="danger hidden" type="button">删除</button><span></span><button id="cancelRecord" class="secondary" type="button">取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>

  <dialog id="textDialog">
    <form id="textForm" method="dialog">
      <div class="dialog-header"><h2 id="textDialogTitle">编辑</h2><button id="closeText" class="icon-button" type="button">×</button></div>
      <label id="textInputLabel">名称<input id="textInput" maxlength="120" required></label>
      <p id="textError" class="error"></p>
      <div class="dialog-actions"><span></span><button id="cancelText" class="secondary" type="button">取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <aside id="updateBanner" class="update-banner hidden" aria-live="polite">
    <span>新版本已准备好</span>
    <button id="applyUpdate" type="button">立即刷新</button>
  </aside>
  <script src="app.js?v=8"></script>
</body>
</html>
